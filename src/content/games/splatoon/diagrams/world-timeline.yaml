# 作中の時系列。Inkipedia の Timeline（英語のファン wiki）と日本語版 Wikipedia による。
# 縦の年表（timeline）はやめ、本編と同じ流れ図（list）で描く（作者の決定）。時代の間隔は矢印のラベル、順番が確定していないところは推測の破線
type: flow
title: 作中の時系列
caption: 上から古い順に読む。小見出しは作中の時期、矢印の横は次の出来事までの間隔。色の四角とその横の名前が、世界の歴史・本編・DLC とスピンオフの区別
lanes:
  - { id: world, label: 世界の歴史, color: l6, icon: gi:ship-wreck }
  - { id: main, label: 本編のヒーローモード, color: l2, icon: gi:squid }
  - { id: extra, label: DLC とスピンオフ, color: l5, icon: gi:octopus }
nodes:
  - id: human-end
    label: 人類の時代が終わる
    short: 人類が消える
    sub: 約1万2千年前
    at: [0, 0]
    lane: world
    kind: start
    icon: gi:ship-wreck
    detail: 海面が大きく上がり、世界は戦争にも巻き込まれる。人類は姿を消す
    sources: [{ label: "Inkipedia「Timeline」（英語のファン wiki）", url: "https://splatoonwiki.org/wiki/Timeline" }]
  - id: first-turf
    label: 最初のナワバリバトル
    short: 最初のバトル
    sub: 約2千年前
    at: [1, 0]
    lane: world
    icon: gi:paint-roller
    detail: 地上に出たイカたちのあいだで、記録に残る最初のナワバリバトルが行われる
    sources: [{ label: "Inkipedia「Timeline」（英語のファン wiki）", url: "https://splatoonwiki.org/wiki/Timeline" }]
  - id: great-turf
    label: 大ナワバリバトル
    short: 大ナワバリバトル
    sub: 100年以上前
    at: [2, 0]
    lane: world
    icon: gi:crossed-swords
    detail: イカとタコの戦争。アタリメ司令はこの戦いの英雄として知られる
    sources: [{ label: "Inkipedia「Timeline」（英語のファン wiki）", url: "https://splatoonwiki.org/wiki/Timeline" }, { label: "Wikipedia「スプラトゥーン」", url: "https://ja.wikipedia.org/wiki/%E3%82%B9%E3%83%97%E3%83%A9%E3%83%88%E3%82%A5%E3%83%BC%E3%83%B3" }]
  - id: s1
    label: 3号がオオデンチナマズを取り戻す
    short: オオデンチナマズ
    sub: スプラ1
    at: [3, 0]
    lane: main
    icon: gi:squid
    detail: 『スプラトゥーン』（2015年発売）。タコの軍団が街のシンボル「オオデンチナマズ」を奪う。3号がアタリメ司令の指揮のもとで取り返す
    sources: [{ label: "Wikipedia「スプラトゥーン」", url: "https://ja.wikipedia.org/wiki/%E3%82%B9%E3%83%97%E3%83%A9%E3%83%88%E3%82%A5%E3%83%BC%E3%83%B3" }]
  - id: s2
    label: 4号がアオリを捜す
    short: アオリを捜す
    sub: スプラ2
    at: [4, 0]
    lane: main
    icon: gi:spray
    detail: 『1』の2年後（2017年発売）。再び消えたオオデンチナマズと、行方不明のアオリを、4号がホタルとともに追う。アタリメ司令と3号は調査の旅に出ていて不在
    sources: [{ label: "Wikipedia「スプラトゥーン2」", url: "https://ja.wikipedia.org/wiki/%E3%82%B9%E3%83%97%E3%83%A9%E3%83%88%E3%82%A5%E3%83%BC%E3%83%B32" }, { label: "Inkipedia「Timeline」（英語のファン wiki）", url: "https://splatoonwiki.org/wiki/Timeline" }]
  - id: oe
    label: 8号が深海メトロを脱出する
    short: 深海メトロ
    sub: オクト
    at: [5, 0]
    lane: extra
    icon: gi:subway
    detail: 『2』と前後（順番は決まっていない）。記憶を失った8号が、地上を目指して深海メトロを進み、タルタル総帥と対決する。タコツボキャニオンの前とも後とも読めるように作られている
    sources: [{ label: "Wikipedia「スプラトゥーン2」", url: "https://ja.wikipedia.org/wiki/%E3%82%B9%E3%83%97%E3%83%A9%E3%83%88%E3%82%A5%E3%83%BC%E3%83%B32" }, { label: "Inkipedia「Timeline」（英語のファン wiki）", url: "https://splatoonwiki.org/wiki/Timeline" }]
  - id: s3
    label: 新3号がオルタナへ向かう
    short: オルタナ
    sub: スプラ3
    at: [6, 0]
    lane: main
    icon: gi:bear-face
    detail: 『2』の5年後（2022年発売）。新3号が、地下空間オルタナで消えたオオデンチナマズを追う。黒幕はクマサン
    sources: [{ label: "Wikipedia「スプラトゥーン3」", url: "https://ja.wikipedia.org/wiki/%E3%82%B9%E3%83%97%E3%83%A9%E3%83%88%E3%82%A5%E3%83%BC%E3%83%B33" }, { label: "Inkipedia「Timeline」（英語のファン wiki）", url: "https://splatoonwiki.org/wiki/Timeline" }]
  - id: so
    label: 8号が秩序の塔に挑む
    short: 秩序の塔
    sub: サイド
    at: [7, 0]
    lane: extra
    icon: gi:tower-flag
    detail: 『3』の時代（2024年配信）。8号が、イイダの作った仮想世界「ネリバース」の秩序の街で目覚め、ドローンになったヒメとともに脱出を目指す
    sources: [{ label: "Wikipedia「スプラトゥーン3」", url: "https://ja.wikipedia.org/wiki/%E3%82%B9%E3%83%97%E3%83%A9%E3%83%88%E3%82%A5%E3%83%BC%E3%83%B33" }, { label: "Inkipedia「Timeline」（英語のファン wiki）", url: "https://splatoonwiki.org/wiki/Timeline" }]
  - id: rd
    label: すりみ連合とウズシオ諸島へ
    short: ウズシオ諸島
    sub: レイダース
    at: [8, 0]
    lane: extra
    icon: gi:treasure-map
    detail: 時期は明示されていない（2026年発売）。メカニックが、すりみ連合とともにウズシオ諸島で宝を探す。すりみ連合の衣装が『3』のフェスにちなむので、『3』の後と考えられる
    evidence: speculation
    sources: [{ label: "Wikipedia「スプラトゥーン レイダース」", url: "https://ja.wikipedia.org/wiki/%E3%82%B9%E3%83%97%E3%83%A9%E3%83%88%E3%82%A5%E3%83%BC%E3%83%B3_%E3%83%AC%E3%82%A4%E3%83%80%E3%83%BC%E3%82%B9" }, { label: "Inkipedia「Splatoon Raiders」（英語のファン wiki）", url: "https://splatoonwiki.org/wiki/Splatoon_Raiders" }]
edges:
  - { from: human-end, to: first-turf, label: 約1万年後 }
  - { from: first-turf, to: great-turf, label: 時代が下る }
  - { from: great-turf, to: s1, label: 100年以上後 }
  - { from: s1, to: s2, label: 2年後 }
  - { from: s2, to: oe, label: 前か後かは未確定, evidence: speculation }
  - { from: oe, to: s3, label: 『2』の5年後 }
  - { from: s3, to: so, label: 同じ時代 }
  - { from: so, to: rd, label: 時期は明示なし, evidence: speculation }
