# 作品1本の物語の流れ。原文は ~/research/per-work-story/sources/（log.md に一覧）
type: flow
title: "オクト・エキスパンション の流れ"
caption: "上から順に読む"
lanes:
  - { id: main, label: "オクト・エキスパンション", color: l3, icon: "gi:subway" }
nodes:
  - id: n1
    label: "深海メトロで目を覚ます"
    sub: "始まり"
    short: "目覚め"
    at: [0, 0]
    lane: main
    kind: start
    evidence: ingame
    detail: "自分がタコであること以外の記憶を失った8号を、アタリメ司令が起こします。ナマコ車掌に「実験体」として迎えられます。"
    sources:
      - { label: "Wikipedia「スプラトゥーン2」", url: "https://ja.wikipedia.org/wiki/%E3%82%B9%E3%83%97%E3%83%A9%E3%83%88%E3%82%A5%E3%83%BC%E3%83%B32" }
      - { label: "Inkipedia「Octo Expansion」（英語のファン wiki）", url: "https://splatoonwiki.org/wiki/Octo_Expansion" }
  - id: n2
    label: "デンワが「アレ」を探させる"
    sub: "中央駅"
    short: "デンワ"
    at: [0, 1]
    lane: main
    kind: scene
    evidence: ingame
    detail: "中央駅のデンワが、約束の地へ行くには4つの「アレ」を集めるよう告げます。地上のヒメとイイダが通信で手助けします。"
    sources:
      - { label: "Wikipedia「スプラトゥーン2」", url: "https://ja.wikipedia.org/wiki/%E3%82%B9%E3%83%97%E3%83%A9%E3%83%88%E3%82%A5%E3%83%BC%E3%83%B32" }
      - { label: "Inkipedia「Timeline」（英語のファン wiki）", url: "https://splatoonwiki.org/wiki/Timeline" }
  - id: n3
    label: "4つの「アレ」を集める"
    sub: "駅の試験"
    short: "アレ"
    at: [0, 2]
    lane: main
    kind: scene
    evidence: ingame
    detail: "各駅の試験をこなして「アレ」を集めると、デンワはそれを組み立てて巨大なミキサーに変え、8号とアタリメ司令を入れようとします。"
    sources:
      - { label: "Inkipedia「Octo Expansion」（英語のファン wiki）", url: "https://splatoonwiki.org/wiki/Octo_Expansion" }
      - { label: "Inkipedia「Timeline」（英語のファン wiki）", url: "https://splatoonwiki.org/wiki/Timeline" }
  - id: n4
    label: "操られた3号と戦う"
    sub: "施設を登る"
    short: "3号"
    at: [0, 3]
    lane: main
    kind: boss
    evidence: ingame
    detail: "天井を破って現れた3号に助けられ、施設を登ります。途中でタルタル総帥に操られた3号と戦い、倒して正気に戻します。"
    sources:
      - { label: "Wikipedia「スプラトゥーン2」", url: "https://ja.wikipedia.org/wiki/%E3%82%B9%E3%83%97%E3%83%A9%E3%83%88%E3%82%A5%E3%83%BC%E3%83%B32" }
      - { label: "Inkipedia「Timeline」（英語のファン wiki）", url: "https://splatoonwiki.org/wiki/Timeline" }
  - id: n5
    label: "ネルス像を止める"
    sub: "地上"
    short: "ネルス像"
    at: [0, 4]
    lane: main
    kind: ending
    evidence: ingame
    detail: "地上に出ると、施設はネルス像として海から立ち上がります。デンワの正体はタルタル総帥でした。8号は像をインクで塗り、ヒメの声の衝撃で像を止めます。"
    sources:
      - { label: "Wikipedia「スプラトゥーン2」", url: "https://ja.wikipedia.org/wiki/%E3%82%B9%E3%83%97%E3%83%A9%E3%83%88%E3%82%A5%E3%83%BC%E3%83%B32" }
      - { label: "Inkipedia「Timeline」（英語のファン wiki）", url: "https://splatoonwiki.org/wiki/Timeline" }
edges:
  - { from: n1, to: n2 }
  - { from: n2, to: n3 }
  - { from: n3, to: n4 }
  - { from: n4, to: n5 }
