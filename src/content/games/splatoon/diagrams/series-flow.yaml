    sources: [{ label: "Wikipedia「スプラトゥーン2」", url: "https://ja.wikipedia.org/wiki/%E3%82%B9%E3%83%97%E3%83%A9%E3%83%88%E3%82%A5%E3%83%BC%E3%83%B32" }]
  - id: s3-hero
    label: オルタナ
    short: オルタナ
    sub: スプラ3
    at: [6, 0]
    lane: s3
    kind: start
    icon: gi:spray
    detail: 新3号が、相棒のコジャケとともに、地下空間オルタナで消えたオオデンチナマズを追う
    sources: [{ label: "Wikipedia「スプラトゥーン3」", url: "https://ja.wikipedia.org/wiki/%E3%82%B9%E3%83%97%E3%83%A9%E3%83%88%E3%82%A5%E3%83%BC%E3%83%B33" }]
  - id: s3-boss
