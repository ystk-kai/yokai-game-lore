# 作品ごとの一人用の物語（ヒーローモード・DLC・スピンオフ）を発売順に並べる。
# 作品の中だけを矢印でつなぎ、作品のあいだはつながない（話は直接続いていない。作中の時系列は world-timeline.yaml）
type: flow
title: 作品ごとの一人用の物語（発売順）
caption: 作品の中は矢印でつながり、作品のあいだは切れている。色の四角とその横の名前が作品。小見出しの「スプラ1」はスプラトゥーン、「オクト」はオクト・エキスパンション、「サイド」はサイド・オーダーの略
lanes:
  - { id: s1, label: スプラトゥーン, color: l1, icon: site:splatoon-squid }
  - { id: s2, label: スプラトゥーン2, color: l2, icon: gi:paint-roller }
  - { id: oe, label: オクト・エキスパンション, color: l3, icon: gi:subway }
  - { id: s3, label: スプラトゥーン3, color: l4, icon: gi:spray }
  - { id: so, label: サイド・オーダー, color: l5, icon: gi:tower-flag }
  - { id: rd, label: スプラトゥーン レイダース, color: l6, icon: gi:treasure-map }
nodes:
  - id: s1-hero
    label: タコツボバレー
    short: タコツボバレー
    sub: スプラ1
    at: [0, 0]
    lane: s1
    kind: start
    icon: site:splatoon-squid
    detail: 3号が、アタリメ司令の指揮のもとで、タコの軍団に奪われた街のシンボル「オオデンチナマズ」を取り返しに向かう
    sources: [{ label: "Wikipedia「スプラトゥーン」", url: "https://ja.wikipedia.org/wiki/%E3%82%B9%E3%83%97%E3%83%A9%E3%83%88%E3%82%A5%E3%83%BC%E3%83%B3" }]
  - id: s1-boss
    label: DJタコワサ将軍との対決
    short: タコワサ戦
    sub: スプラ1
    at: [1, 0]
    lane: s1
    kind: boss
    icon: gi:octopus
    detail: タコの軍団を率いるDJタコワサ将軍を倒し、オオデンチナマズを取り戻す
    sources: [{ label: "Wikipedia「スプラトゥーン」", url: "https://ja.wikipedia.org/wiki/%E3%82%B9%E3%83%97%E3%83%A9%E3%83%88%E3%82%A5%E3%83%BC%E3%83%B3" }, { label: "Inkipedia（英語のファン wiki）「Octo Valley」", url: "https://splatoonwiki.org/wiki/Octo_Valley" }]
  - id: s2-hero
    label: タコツボキャニオン
    short: キャニオン
    sub: スプラ2
    at: [2, 0]
    lane: s2
    kind: start
    icon: gi:paint-roller
    detail: 4号が、ホタルとともに、再び消えたオオデンチナマズと行方不明のアオリを追う
    sources: [{ label: "Wikipedia「スプラトゥーン2」", url: "https://ja.wikipedia.org/wiki/%E3%82%B9%E3%83%97%E3%83%A9%E3%83%88%E3%82%A5%E3%83%BC%E3%83%B32" }]
  - id: s2-boss
    label: 洗脳されたアオリとの対決
    short: アオリ戦
    sub: スプラ2
    at: [3, 0]
    lane: s2
    kind: boss
    icon: gi:brain-freeze
    detail: DJタコワサ将軍が「タコツボキング A-MIX」に乗り、洗脳したアオリとともに4号の前に立ちはだかる
    sources: [{ label: "Wikipedia「スプラトゥーン2」", url: "https://ja.wikipedia.org/wiki/%E3%82%B9%E3%83%97%E3%83%A9%E3%83%88%E3%82%A5%E3%83%BC%E3%83%B32" }]
