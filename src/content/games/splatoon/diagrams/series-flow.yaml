    sources: [{ label: "Wikipedia「スプラトゥーン3」", url: "https://ja.wikipedia.org/wiki/%E3%82%B9%E3%83%97%E3%83%A9%E3%83%88%E3%82%A5%E3%83%BC%E3%83%B33" }, { label: "Inkipedia「Overlorder」（英語のファン wiki。各言語の名前）", url: "https://splatoonwiki.org/wiki/Overlorder" }]
  - id: rd-hero
    label: ウズシオ諸島
    short: ウズシオ諸島
    sub: レイダース
    at: [10, 0]
    lane: rd
    kind: start
    icon: gi:treasure-map
    detail: メカニックが、すりみ連合とともにウズシオ諸島で宝を探す。シリーズ初のスピンオフ
    sources: [{ label: "Wikipedia「スプラトゥーン レイダース」", url: "https://ja.wikipedia.org/wiki/%E3%82%B9%E3%83%97%E3%83%A9%E3%83%88%E3%82%A5%E3%83%BC%E3%83%B3_%E3%83%AC%E3%82%A4%E3%83%80%E3%83%BC%E3%82%B9" }]
  - id: rd-boss
    label: サルモン王との対決
    short: サルモン王戦
    sub: レイダース
    at: [11, 0]
    lane: rd
    kind: boss
    icon: gi:fish-monster
    detail: 本編の最後にサルモン王を倒す
    sources: [{ label: "Game8『スプラトゥーン レイダース』", url: "https://game8.jp/splatoon-raiders/801055" }]
  - id: rd-true
    label: 無限食堂の裏ボス
    short: 真エンディング
    sub: レイダース
    at: [12, 0]
    lane: rd
    kind: ending
    icon: gi:crown
    detail: クリア後に遊べる「無限食堂」の100階で裏ボスを倒すと、真エンディングが見られる
    sources: [{ label: "Game8『スプラトゥーン レイダース』", url: "https://game8.jp/splatoon-raiders/801055" }]
edges:
  - { from: s1-hero, to: s1-boss }
  - { from: s2-hero, to: s2-boss }
  - { from: oe-hero, to: oe-boss }
  - { from: s3-hero, to: s3-boss }
  - { from: so-hero, to: so-boss }
  - { from: rd-hero, to: rd-boss }
