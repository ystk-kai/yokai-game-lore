    short: クマサン戦
    sub: スプラ3
    at: [7, 0]
    lane: s3
    kind: boss
    icon: gi:bear-face
    detail: オオデンチナマズを奪った黒幕は、クマサン商会の社長クマサンだった
    sources: [{ label: "Inkipedia（英語のファン wiki）「Return of the Mammalians」", url: "https://splatoonwiki.org/wiki/Return_of_the_Mammalians" }]
  - id: so-hero
    label: 秩序の塔
    short: 秩序の塔
    sub: サイド
    at: [8, 0]
    lane: so
    kind: start
    icon: gi:tower-flag
    detail: 8号が、仮想世界「ネリバース」の色を失った「秩序の街」で目覚め、ドローンになったヒメとともに「秩序の塔」を登る
    sources: [{ label: "Wikipedia「スプラトゥーン3」", url: "https://ja.wikipedia.org/wiki/%E3%82%B9%E3%83%97%E3%83%A9%E3%83%88%E3%82%A5%E3%83%BC%E3%83%B33" }]
  - id: so-boss
    label: オーダコとの対決
