# 本編の流れ（全9章）。章名は gamerch の章別攻略チャートの日本語表記に合わせた
# 並び: 3列で折り返す（1段目 左→右、2段目 右→左、3段目 左→右、4段目 右→左）。矢印が進む向きを示す
type: flow
title: 本編の流れ（全9章）
caption: カード上辺の色は舞台。番号の順に、矢印をたどって読む
lanes:
  - { id: well, label: 井戸（始まりと結末）, color: l6, icon: gi:well }
  - { id: sea, label: 海と水没した町, color: l2, icon: gi:boat-fishing }
  - { id: town, label: スニッファーの町, color: l4, icon: gi:ice-cream-cone }
  - { id: orphanage, label: 孤児院と砂の町, color: l5, icon: gi:puppet }
  - { id: war, label: 戦場, color: l1, icon: gi:barbed-wire }
nodes:
  - id: start
    label: 井戸をのぞく5人の子ども
    sub: 冒頭
    at: [0, 0]
    lane: well
    kind: start
    icon: gi:well
    detail: 冒頭で5人の子どもが井戸をのぞき込む。少年はその後、黒い海に浮かぶ小舟の上でひとり目を覚ます。
    sources:
      - { label: "Into Indie Games「Reanimal: Story Explained」", url: "https://intoindiegames.com/features/reanimal-story-explained/" }
  - id: ch1
    label: 水中死
    sub: 第1章
    at: [1, 0]
    lane: sea
    icon: gi:boat-fishing
    detail: 小舟で機雷の海を抜け、海に浮かぶ少女を引き上げる。砂浜から施設（巨大なファン・下水道）、中庭と倉庫、線路と列車を経て森の町へ。途中でフードの子と再会する。
    sources:
      - { label: gamerch チャプター1 攻略チャート, url: "https://gamerch.com/reanimal/964699" }
      - { label: "Into Indie Games「Story Explained」", url: "https://intoindiegames.com/features/reanimal-story-explained/" }
  - id: ch2
    label: 掃除屋
    sub: 第2章
    at: [2, 0]
    lane: town
    icon: gi:ice-cream-cone
    kind: boss
    detail: 森の町で、人の皮を服のように着る怪物「スニッファー」に追われる。映画館と公園、ランドリーを抜け、アイスクリームの車を奪って逃げるが、崩れた道路から落ちる。
    sources:
      - { label: gamerch チャプター2 攻略チャート, url: "https://gamerch.com/reanimal/964981" }
      - { label: "Into Indie Games「Story Explained」", url: "https://intoindiegames.com/features/reanimal-story-explained/" }
  - id: ch3
    label: 洪水の後で
    sub: 第3章
    at: [2, 1]
    lane: sea
    icon: gi:lighthouse
    detail: 砂浜に戻り、ボートで水没した町へ。ホテルでバンデージが巨大な鳥にさらわれ、灯台まで追って助け出す。養豚場を抜け、最後はバスで次の場所へ向かう。
    sources:
      - { label: gamerch チャプター3 攻略チャート, url: "https://gamerch.com/reanimal/964986" }
      - { label: "Into Indie Games「Story Explained」", url: "https://intoindiegames.com/features/reanimal-story-explained/" }
  - id: ch4
    label: 宿なし
    sub: 第4章
    at: [1, 1]
    lane: orphanage
    icon: gi:puppet
    detail: バスを降りて孤児院へ。人形のような敵がいる廊下を抜け、奥の舞台の部屋で仲間に近づくと、兄妹は縛られて穴に落とされる。
    sources:
      - { label: gamerch チャプター4 攻略チャート, url: "https://gamerch.com/reanimal/965002" }
  - id: ch5
    label: 穴の中へ
    sub: 第5章
    at: [0, 1]
    lane: orphanage
    kind: boss
    icon: gi:long-legged-spider
    detail: 手を縛られロープでつながれたまま砂の町から孤児院へ戻る。穴の底の巨大な蜘蛛のような怪物「マザー」を槍で倒し、その中から仲間（バケット）を助け出す。軍のトラックに乗ってトンネルへ。
    sources:
      - { label: gamerch チャプター5 攻略チャート, url: "https://gamerch.com/reanimal/965211" }
      - { label: "Into Indie Games「Story Explained」", url: "https://intoindiegames.com/features/reanimal-story-explained/" }
  - id: ch6
    label: 誰も置き去りにしない
    sub: 第6章
    at: [0, 2]
    lane: sea
    icon: gi:sperm-whale
    detail: トンネルから砲台の島へ。沈んだ軍艦の中で目のないクジラに出会い、馬のような海の怪物から取った目をクジラに渡すと道が開く。終盤、少女が羊を吐き出し、羊は走り去る。
    sources:
      - { label: gamerch チャプター6 攻略チャート, url: "https://gamerch.com/reanimal/965458" }
      - { label: "Into Indie Games「Story Explained」", url: "https://intoindiegames.com/features/reanimal-story-explained/" }
  - id: ch7
    label: 戦利品
    sub: 第7章
    at: [1, 2]
    lane: war
    icon: gi:barbed-wire
    detail: 塹壕・防空壕・野戦病院。近づくと自爆する兵士や、後ろから迫る怪物から逃げる。
    sources:
      - { label: gamerch チャプター7 攻略チャート, url: "https://gamerch.com/reanimal/965663" }
  - id: ch8
    label: 監視者
    sub: 第8章
    at: [2, 2]
    lane: war
    icon: gi:eye-target
    detail: 廃屋、処刑場、駐車場、市街の廃墟。時計塔の狙撃手を倒し、最後は戦車と戦う。
    sources:
      - { label: gamerch チャプター8 攻略チャート, url: "https://gamerch.com/reanimal/965945" }
  - id: ch9
    label: すべてを焼き尽くす過去
    sub: 第9章
    at: [2, 3]
    lane: war
    kind: boss
    icon: gi:sheep
    detail: 奪った戦車で進むと、巨大になった羊が現れる。少年が呑み込まれ、操作は少女に移るが、少女も呑まれる。羊の体内で、少女は小屋で死んだ白いウサギを見つける。
    sources:
      - { label: gamerch チャプター9 攻略チャート, url: "https://gamerch.com/reanimal/966038" }
      - { label: "Into Indie Games「Chapter 9 - All Consuming Past」", url: "https://intoindiegames.com/walkthroughs/reanimal-walkthrough-chapter-9-all-consuming-past/" }
  - id: ending
    label: 通常エンディング
    sub: 結末
    at: [1, 3]
    lane: well
    kind: ending
    icon: gi:well
    detail: 4人の少年が少女を袋に入れて井戸まで引きずり、投げ込む。井戸があふれる。
    sources:
      - { label: "Into Indie Games「Story Explained」", url: "https://intoindiegames.com/features/reanimal-story-explained/" }
  - id: hidden
    label: 隠しエンディング
    sub: 結末
    at: [0, 3]
    lane: well
    kind: ending
    icon: gi:coffin
    detail: 各章に散らばる棺桶5つをすべて確認すると、通常エンディングに映像が加わる。白い仮面の黒い影たちが、井戸の底の少女に静かに近づく。1周目でも条件を満たせる。
    sources:
      - { label: kamigame 隠しエンディングの解放条件, url: "https://kamigame.jp/reanimal/page/409554313107497530.html" }
      - { label: "Into Indie Games「Story Explained」", url: "https://intoindiegames.com/features/reanimal-story-explained/" }
edges:
  - { from: start, to: ch1 }
  - { from: ch1, to: ch2 }
  - { from: ch2, to: ch3, label: 道路から落下 }
  - { from: ch3, to: ch4, label: バスで移動 }
  - { from: ch4, to: ch5, label: 穴に落とされる }
  - { from: ch5, to: ch6, label: トラックでトンネルへ }
  - { from: ch6, to: ch7 }
  - { from: ch7, to: ch8 }
  - { from: ch8, to: ch9, label: 戦車を奪う }
  - { from: ch9, to: ending }
  - { from: ending, to: hidden, label: 棺桶5つ }
