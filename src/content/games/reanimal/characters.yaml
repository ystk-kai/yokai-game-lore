# 作中に固有名は出ない。少年・少女以外の呼び名はプレイヤーの通称（Into Indie Games / kamigame の表記）
characters:
  - id: boy
    name: 少年
    name_en: Boy
    kind: protagonist
    icon: gi:scarecrow
    role: 主人公。1人プレイで操作する
    looks: 頭に袋をかぶり、首に縄を巻いている（kamigame は「マフラー」と書く）
    first_seen: 冒頭・第1章（小舟の上で目を覚ます）
    secret: 第9章で羊に呑み込まれる。首を吊られた過去があるのでは、という考察がある（棺桶の映像から）
    spoiler: 第9章と棺桶の映像
    appears_in: [main]
    evidence: ingame
    sources:
      - { label: "Into Indie Games「Story Explained」", url: "https://intoindiegames.com/features/reanimal-story-explained/" }
      - { label: kamigame 登場キャラ一覧と考察, url: "https://kamigame.jp/reanimal/page/409383509522651637.html" }
  - id: girl
