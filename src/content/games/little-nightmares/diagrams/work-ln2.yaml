    lane: main
    kind: boss
    evidence: ingame
    detail: "病院では、マネキンのような患者と、天井をはうドクターに追われます。途中でシックスの黄色いレインコートを見つけます。モノはドクターを焼却炉へ誘い込みます。"
    sources:
      - { label: "Wikipedia「Little Nightmares II」（英語）", url: "https://en.wikipedia.org/wiki/Little_Nightmares_II" }
