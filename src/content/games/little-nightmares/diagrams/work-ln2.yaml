    lane: main
    kind: start
    evidence: ingame
    detail: "荒野で目を覚ましたモノは、猟師の小屋に捕らわれていたシックスを助けます。追ってくる猟師を猟銃で倒し、扉をいかだにして街へ流れ着きます。"
