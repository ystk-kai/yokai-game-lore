    sub: "チャプター2"
    short: "学校"
    at: [0, 1]
    lane: main
    kind: boss
    evidence: ingame
    detail: "二人は学校に入り、陶器のいじめっ子たちにシックスがさらわれます。モノがシックスを助け、首の伸びる先生から逃げます。"
    sources:
      - { label: "Wikipedia「Little Nightmares II」（英語）", url: "https://en.wikipedia.org/wiki/Little_Nightmares_II" }
