# 作品1本の物語の流れ。原文は ~/research/per-work-story/sources/（log.md に一覧）
type: flow
title: "リトルナイトメア の流れ"
caption: "上から順に読む"
lanes:
  - { id: main, label: "リトルナイトメア", color: l1, icon: "gi:ship-bow" }
nodes:
  - id: n1
    label: "監獄で目を覚ます"
    sub: "監獄"
    short: "目覚め"
    at: [0, 0]
    lane: main
    kind: start
    evidence: ingame
    detail: "レディの夢から目を覚ましたシックスが、ライター1つで船の底を進みます。小さな住人ノームが、物陰からシックスを見ています。"
    sources:
      - { label: "Wikipedia『リトルナイトメア』", url: "https://ja.wikipedia.org/wiki/%E3%83%AA%E3%83%88%E3%83%AB%E3%83%8A%E3%82%A4%E3%83%88%E3%83%A1%E3%82%A2" }
  - id: n2
    label: "管理人の腕を断つ"
    sub: "隠れ家"
    short: "管理人"
    at: [0, 1]
    lane: main
    kind: boss
    evidence: ingame
    detail: "空腹で罠の生肉を食べたシックスは、管理人に捕まります。檻を倒して逃げ、追ってきた管理人の両腕を扉で断ちます。"
    sources:
      - { label: "Wikipedia『リトルナイトメア』", url: "https://ja.wikipedia.org/wiki/%E3%83%AA%E3%83%88%E3%83%AB%E3%83%8A%E3%82%A4%E3%83%88%E3%83%A1%E3%82%A2" }
  - id: n3
    label: "双子のシェフから逃げる"
    sub: "台所"
    short: "シェフ"
    at: [0, 2]
    lane: main
    kind: scene
    evidence: ingame
    detail: "空腹で弱ったシックスは、生きたネズミを食べます。包まれた子どもが送られてくる台所で、双子のシェフから逃げます。"
    sources:
      - { label: "Wikipedia『リトルナイトメア』", url: "https://ja.wikipedia.org/wiki/%E3%83%AA%E3%83%88%E3%83%AB%E3%83%8A%E3%82%A4%E3%83%88%E3%83%A1%E3%82%A2" }
  - id: n4
    label: "ゲストの宴とノーム"
    sub: "ゲストエリア"
    short: "ゲスト"
    at: [0, 3]
    lane: main
    kind: scene
    evidence: ingame
    detail: "船の外へ出たシックスは、ゲストの行列が船に入っていくのを見ます。宴の席でゲストに追われ、ソーセージを差し出したノームを食べます。"
    sources:
      - { label: "Wikipedia『リトルナイトメア』", url: "https://ja.wikipedia.org/wiki/%E3%83%AA%E3%83%88%E3%83%AB%E3%83%8A%E3%82%A4%E3%83%88%E3%83%A1%E3%82%A2" }
  - id: n5
    label: "レディを食べて外へ出る"
    sub: "レディの部屋"
    short: "レディ"
    at: [0, 4]
    lane: main
    kind: ending
    evidence: ingame
    detail: "割れていない鏡でレディを弱らせ、首にかみついて食べます。力を得たシックスがゲストエリアを歩くと、近くのゲストが倒れていきます。最後はモウの外の光の中へ出ます。"
    sources:
      - { label: "Wikipedia『リトルナイトメア』", url: "https://ja.wikipedia.org/wiki/%E3%83%AA%E3%83%88%E3%83%AB%E3%83%8A%E3%82%A4%E3%83%88%E3%83%A1%E3%82%A2" }
      - { label: "Wikipedia「Little Nightmares」（英語）", url: "https://en.wikipedia.org/wiki/Little_Nightmares" }
edges:
  - { from: n1, to: n2 }
  - { from: n2, to: n3 }
  - { from: n3, to: n4 }
  - { from: n4, to: n5 }
