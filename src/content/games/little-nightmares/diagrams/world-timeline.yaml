    sub: リトル3
    at: [6, 0]
    lane: ln3
    icon: gi:spiral-shell
    evidence: official
    detail: 『3』と追加チャプター。ノーウェアの中の「スパイラル」が舞台で、シックスもモノも出てこない。プロデューサーは、物語は完全に独立していて、世界は『1』『2』と同じだと話している。ほかの作品との前後は発表されていない
    sources:
