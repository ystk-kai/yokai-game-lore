# 作中の時系列。発売順（1 → 2 → 3）とは違い、『2』は『1』より前の話（Tarsier の David Mervik が GamingBible の取材で明言、2021-03）。
# 『3』の位置は公式に決まっていない（プロデューサー Coralie Feniello は「物語は完全に独立、世界は 1・2 と同じ」）。根拠のない矢印は引かない
type: flow
title: 作中の時系列
caption: 上から古い順に読む。小見出しは作品の名前、矢印の横は次の出来事とのつながり。破線は推測。『3』はほかの作品との前後が発表されていないので、矢印でつないでいない
