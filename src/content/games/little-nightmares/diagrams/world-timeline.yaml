nodes:
  - id: vln
    label: 黄色いレインコートの少女と巣
    short: 巣
    sub: ベリーリトル
    at: [0, 0]
    lane: six
    kind: start
    icon: gi:house
    evidence: official
    detail: モバイル版『ベリーリトルナイトメア』（2019年）。黄色いレインコートの少女が「巣」と呼ばれる屋敷から逃げる。公式はシックスの過去の謎を明かす作品と説明し、『1』の前日譚と発表された
    sources:
      - { label: "Bandai Namco Europe「Very Little Nightmares」", url: "https://en.bandainamcoent.eu/news/very-little-nightmares-very-little-still-deadly" }
