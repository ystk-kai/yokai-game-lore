      - { label: "Wikipedia「Little Nightmares (franchise)」（英語）", url: "https://en.wikipedia.org/wiki/Little_Nightmares_(franchise)" }
  - id: ln2
    label: モノとシックスが電波塔へ
    short: 電波塔
    sub: リトル2
    at: [1, 0]
    lane: six
    icon: gi:radio-tower
    detail: モノが荒野の小屋でシックスを助け、二人でペイルシティの電波塔を目指す。最後にシックスはモノの手を放して去り、モノは塔の中でノッポ男になる
    sources:
      - { label: Wikipedia『リトルナイトメア2』, url: "https://ja.wikipedia.org/wiki/%E3%83%AA%E3%83%88%E3%83%AB%E3%83%8A%E3%82%A4%E3%83%88%E3%83%A1%E3%82%A22" }
      - { label: "Wikipedia「Little Nightmares II」（英語）", url: "https://en.wikipedia.org/wiki/Little_Nightmares_II" }
  - id: vr
    label: ダーク・シックスが塔をさまよう
    short: 影のシックス
    sub: VR
    at: [2, 0]
    lane: other
    icon: gi:vr-headset
    detail: 『Altered Echoes』（VR、2026年）。ノッポ男がシックスをさらったとき、シックスから切り離された影「ダーク・シックス」が、電波塔の中でシックスを追う。日本語の名前は未確認
    sources:
      - { label: "Wikipedia「Little Nightmares VR: Altered Echoes」（英語）", url: "https://en.wikipedia.org/wiki/Little_Nightmares_VR:_Altered_Echoes" }
  - id: ln2-secret
    label: シックスがモウのチラシを見る
    short: チラシ
    sub: リトル2 隠し
    at: [3, 0]
    lane: six
    icon: gi:newspaper
    detail: 『2』の隠しエンディング（ゲーム中の残留物をすべて集めると見られる）。テレビから出たシックスの前に影のシックスが現れ、床のモウのチラシを指す。シックスのお腹が鳴る
    sources:
      - { label: "Wikipedia「Little Nightmares II」（英語）", url: "https://en.wikipedia.org/wiki/Little_Nightmares_II" }
      - { label: Wikipedia『リトルナイトメア2』, url: "https://ja.wikipedia.org/wiki/%E3%83%AA%E3%83%88%E3%83%AB%E3%83%8A%E3%82%A4%E3%83%88%E3%83%A1%E3%82%A22" }
  - id: ln1
    label: シックスがモウから出る
    short: モウ
    sub: リトル1
    at: [4, 0]
    lane: six
    icon: site:little-nightmares-six
    detail: シックスが、海を渡る巨大な船「モウ」の奥で目を覚まし、空腹に耐えながら上へ逃げる。最後にレディの首にかみついて力を得て、日の光の中へ出る
    sources:
      - { label: Wikipedia『リトルナイトメア』, url: "https://ja.wikipedia.org/wiki/LITTLE_NIGHTMARES-%E3%83%AA%E3%83%88%E3%83%AB%E3%83%8A%E3%82%A4%E3%83%88%E3%83%A1%E3%82%A2-" }
