<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 640" width="1200" height="640" role="img" aria-labelledby="t d">
  <title id="t">サイトの作りと、ページができるまで</title>
  <desc id="d">ゲームごとに、シリーズ全体のページと、作品ごとの物語・考察のページがある。原文の調査からコンテンツを書き、検査を通して静的サイトにする。</desc>
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#a3aab8"/></marker>
  </defs>
  <style>
    text { font-family: "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Noto Sans JP", "Noto Sans CJK JP", "Yu Gothic", Meiryo, sans-serif; fill: #e8eaef; }
    .muted { fill: #a3aab8; }
    .h { font-size: 26px; font-weight: 700; }
    .bt { font-size: 19px; font-weight: 700; }
    .bs { font-size: 14px; }
    .code { font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; font-size: 13px; fill: #a3aab8; }
    .card { fill: #1a1d24; stroke: #363b47; stroke-width: 1.5; }
  </style>
  <rect width="1200" height="640" fill="#111318"/>

  <!-- 上段: サイトの作り -->
  <text x="60" y="64" class="h">1つのゲームのページ</text>
  <rect x="60" y="92" width="250" height="96" rx="10" class="card" stroke="#ff7a5c"/>
  <text x="84" y="132" class="bt">ゲームのトップ</text>
  <text x="84" y="162" class="bs muted">概要と作品一覧</text>

  <line x1="314" y1="140" x2="356" y2="140" stroke="#a3aab8" stroke-width="2" marker-end="url(#ar)"/>
  <g>
    <rect x="360" y="92" width="370" height="96" rx="10" class="card"/>
    <text x="384" y="132" class="bt">シリーズ全体</text>
    <text x="384" y="162" class="bs muted">物語の流れ・登場人物・シリーズの考察</text>
  </g>
  <line x1="185" y1="192" x2="185" y2="236" stroke="#a3aab8" stroke-width="2" marker-end="url(#ar)"/>
  <rect x="60" y="240" width="1080" height="120" rx="10" class="card"/>
  <text x="84" y="278" class="bt">作品ごと（本編・DLC・スピンオフ）</text>
  <rect x="84" y="298" width="300" height="44" rx="6" fill="#111318" stroke="#6aa6ff" stroke-width="2"/>
  <text x="104" y="326" class="bs">物語の流れ（章ごとの流れ図）</text>
  <rect x="404" y="298" width="300" height="44" rx="6" fill="#111318" stroke="#bb93ff" stroke-width="2" stroke-dasharray="6 4"/>
  <text x="424" y="326" class="bs">考察（誰の説か・根拠の強さ）</text>
  <text x="730" y="326" class="bs muted">ページ上部のタブで行き来する</text>

  <!-- 下段: ページができるまで -->
  <text x="60" y="424" class="h">ページができるまで</text>
  <g>
    <rect x="60" y="452" width="240" height="140" rx="10" class="card"/>
    <text x="84" y="492" class="bt">原文を調べる</text>
    <text x="84" y="522" class="bs muted">記事・公式・wiki を保存</text>
    <text x="84" y="556" class="code">~/research/&lt;話題&gt;/</text>
  </g>
  <line x1="304" y1="522" x2="336" y2="522" stroke="#a3aab8" stroke-width="2" marker-end="url(#ar)"/>
  <g>
    <rect x="340" y="452" width="240" height="140" rx="10" class="card"/>
    <text x="364" y="492" class="bt">データを書く</text>
    <text x="364" y="522" class="bs muted">図は YAML、本文は MDX</text>
    <text x="364" y="556" class="code">src/content/games/</text>
  </g>
  <line x1="584" y1="522" x2="616" y2="522" stroke="#a3aab8" stroke-width="2" marker-end="url(#ar)"/>
  <g>
    <rect x="620" y="452" width="240" height="140" rx="10" class="card"/>
    <text x="644" y="492" class="bt">検査する</text>
    <text x="644" y="522" class="bs muted">出典・権利・ラベルの長さ</text>
    <text x="644" y="556" class="code">bun run check</text>
  </g>
  <line x1="864" y1="522" x2="896" y2="522" stroke="#a3aab8" stroke-width="2" marker-end="url(#ar)"/>
  <g>
    <rect x="900" y="452" width="240" height="140" rx="10" class="card" stroke="#45c993"/>
    <text x="924" y="492" class="bt">公開する</text>
    <text x="924" y="522" class="bs muted">静的サイトとして配信</text>
    <text x="924" y="556" class="code">GitHub Pages</text>
  </g>
</svg>
